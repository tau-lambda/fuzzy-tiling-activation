[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzy-tiling-activation"
version = "0.1.0"
description = "Fuzzy Tiling Activation (FTA) for PyTorch and JAX/Flax"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["activation-function", "neural-network", "reinforcement-learning", "fuzzy-tiling"]
authors = [{name = "Ty Lazar"}]

[project.optional-dependencies]
torch = ["torch>=2.1.1"]
jax = ["jax>=0.6.2", "flax>=0.10.7"]

[project.urls]
Repository = "https://github.com/tau-lambda/fuzzy-tiling-activation"
